services:
  - type: web
    name: invisible-ink-pool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invisible-ink-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
databases:
  - name: invisible-ink-db
    plan: free
